<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minty — Banking Information Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6FAF8;
    --ink: #0E2A25;
    --muted: #5B6E69;
    --mint: #17A673;
    --mint-deep: #0F5C46;
    --hairline: #DCE8E3;
    --amber: #C98A2B;
    --coral: #C2554B;
    --surface: #FFFFFF;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 64px);
    animation: settle 500ms ease-out;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 4px 20px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 20px;
  }

  .leaf {
    width: 26px;
    height: 26px;
    color: var(--mint);
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--ink);
  }

  .tagline {
    font-size: 0.8rem;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 4px 4px 24px;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  /* Empty state */
  .empty-state {
    margin: auto 0;
    text-align: left;
    padding: 8px 4px;
  }

  .empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.25rem;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .empty-state p {
    color: var(--muted);
    margin: 0 0 18px;
    font-size: 0.92rem;
    max-width: 46ch;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .suggestion-chip {
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--mint-deep);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease;
  }

  .suggestion-chip:hover {
    border-color: var(--mint);
    background: #EFFAF5;
  }

  .suggestion-chip:focus-visible {
    outline: 2px solid var(--mint);
    outline-offset: 2px;
  }

  /* Messages */
  .msg {
    display: flex;
    animation: rise 240ms ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    justify-content: flex-end;
  }

  .msg.user .bubble {
    background: var(--mint-deep);
    color: #F3FBF8;
    padding: 11px 16px;
    border-radius: var(--radius);
    border-bottom-right-radius: 4px;
    max-width: 78%;
    font-size: 0.95rem;
    line-height: 1.45;
  }

  .msg.assistant {
    justify-content: flex-start;
  }

  .note {
    max-width: 88%;
    border-left: 3px solid var(--mint);
    padding: 2px 0 2px 16px;
  }

  .note.error {
    border-left-color: var(--coral);
  }

  .note-text {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .note.error .note-text {
    color: #7A332C;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }

  .source-chip {
    font-size: 0.72rem;
    color: var(--mint-deep);
    background: #EFFAF5;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .cached-badge {
    font-size: 0.72rem;
    color: var(--amber);
    background: #FBF3E6;
    border: 1px solid #EFDCB8;
    border-radius: 999px;
    padding: 3px 10px;
  }

  /* Typing indicator */
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 6px 0;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--mint);
    opacity: 0.3;
    animation: pulse-dot 1.1s ease-in-out infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse-dot {
    0%, 60%, 100% { opacity: 0.25; transform: scale(1); }
    30% { opacity: 1; transform: scale(1.15); }
  }

  /* Input row */
  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
  }

  #query {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.4;
    color: var(--ink);
    max-height: 120px;
    padding: 6px 4px;
    background: transparent;
  }

  #query::placeholder {
    color: var(--muted);
  }

  #send {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: none;
    background: var(--mint-deep);
    color: white;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 150ms ease;
  }

  #send:hover:not(:disabled) { background: var(--mint); }
  #send:disabled { background: #A9C7BE; cursor: default; }

  #send:focus-visible {
    outline: 2px solid var(--mint-deep);
    outline-offset: 2px;
  }

  #send svg {
    width: 18px;
    height: 18px;
  }

  .spinner {
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .app, .msg, .typing-dots span, .spinner {
      animation: none !important;
      transition: none !important;
    }
  }

  @media (max-width: 480px) {
    body { padding: 16px 10px; }
    .msg.user .bubble, .note { max-width: 92%; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <svg class="leaf" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 14C4 7 9 3 20 3C20 13 15 20 8 20C6.5 20 5 19.5 4 18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 3C14 6 9 10 5 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div class="brand">
      <span class="wordmark">Minty</span>
      <span class="tagline">Banking answers, grounded in the source.</span>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="input-row" class="input-row">
    <textarea
      id="query"
      rows="1"
      placeholder="Ask about fees, limits, or accounts…"
      aria-label="Ask Minty a question"
    ></textarea>
    <button id="send" type="submit" aria-label="Send">
      <svg id="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>
</div>

<script>
  const sessionId = crypto.randomUUID();
  const chat = document.getElementById("chat");
  const form = document.getElementById("input-row");
  const queryEl = document.getElementById("query");
  const sendBtn = document.getElementById("send");
  const sendIcon = document.getElementById("send-icon");

  const SEND_SVG = sendIcon.outerHTML;
  const SPINNER_SVG = `<svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="9" stroke-opacity="0.25"></circle>
    <path d="M21 12a9 9 0 0 0-9-9"></path>
  </svg>`;

  const SUGGESTIONS = [
    "What's the daily ATM withdrawal limit?",
    "Are there fees for out-of-network ATMs?",
    "How do I request a credit limit increase?",
  ];

  function showEmptyState() {
    const wrap = document.createElement("div");
    wrap.className = "empty-state";
    wrap.id = "empty-state";
    wrap.innerHTML = `
      <h2>Ask about anything on the books</h2>
      <p>Minty only answers from published account, fee, and card information — and says so plainly when something isn't covered.</p>
      <div class="chip-row"></div>
    `;
    const row = wrap.querySelector(".chip-row");
    SUGGESTIONS.forEach((text) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "suggestion-chip";
      chip.textContent = text;
      chip.addEventListener("click", () => {
        queryEl.value = text;
        sendMessage();
      });
      row.appendChild(chip);
    });
    chat.appendChild(wrap);
  }

  function clearEmptyState() {
    const el = document.getElementById("empty-state");
    if (el) el.remove();
  }

  function addUserMessage(text) {
    const msg = document.createElement("div");
    msg.className = "msg user";
    msg.innerHTML = `<div class="bubble"></div>`;
    msg.querySelector(".bubble").textContent = text;
    chat.appendChild(msg);
    scrollToBottom();
  }

  function addAssistantMessage(text, { sources = [], cached = false, isError = false } = {}) {
    const msg = document.createElement("div");
    msg.className = "msg assistant";

    const note = document.createElement("div");
    note.className = "note" + (isError ? " error" : "");

    const p = document.createElement("div");
    p.className = "note-text";
    p.textContent = text;
    note.appendChild(p);

    if (sources.length > 0 || cached) {
      const meta = document.createElement("div");
      meta.className = "meta-row";
      sources.forEach((src) => {
        const chip = document.createElement("span");
        chip.className = "source-chip";
        chip.textContent = src.split(/[\\/]/).pop();
        meta.appendChild(chip);
      });
      if (cached) {
        const badge = document.createElement("span");
        badge.className = "cached-badge";
        badge.textContent = "instant · cached";
        meta.appendChild(badge);
      }
      note.appendChild(meta);
    }

    msg.appendChild(note);
    chat.appendChild(msg);
    scrollToBottom();
  }

  let typingEl = null;

  function showTyping() {
    typingEl = document.createElement("div");
    typingEl.className = "msg assistant";
    typingEl.innerHTML = `
      <div class="note">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    `;
    chat.appendChild(typingEl);
    scrollToBottom();
  }

  function hideTyping() {
    if (typingEl) {
      typingEl.remove();
      typingEl = null;
    }
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function setSending(isSending) {
    sendBtn.disabled = isSending;
    queryEl.disabled = isSending;
    sendBtn.innerHTML = isSending ? SPINNER_SVG : SEND_SVG;
  }

  function autoResize() {
    queryEl.style.height = "auto";
    queryEl.style.height = Math.min(queryEl.scrollHeight, 120) + "px";
  }

  async function sendMessage() {
    const text = queryEl.value.trim();
    if (!text) return;

    clearEmptyState();
    addUserMessage(text);
    queryEl.value = "";
    autoResize();
    setSending(true);
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text, session_id: sessionId }),
      });

      hideTyping();

      if (!res.ok) {
        const detail = res.status === 429
          ? "You're sending questions a little fast — wait a moment and try again."
          : "Minty hit an unexpected error handling that question.";
        addAssistantMessage(detail, { isError: true });
        return;
      }

      const data = await res.json();
      addAssistantMessage(data.answer, {
        sources: data.sources || [],
        cached: !!data.cached,
      });
    } catch (err) {
      hideTyping();
      addAssistantMessage(
        "Couldn't reach Minty. Check that the server is running and try again.",
        { isError: true }
      );
    } finally {
      setSending(false);
      queryEl.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage();
  });

  queryEl.addEventListener("input", autoResize);

  queryEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  showEmptyState();
  queryEl.focus();
</script>

</body>
</html>
