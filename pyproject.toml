[project]
name = "minty"
version = "0.1.0"
description = "AI-powered banking information assistant using agentic RAG"
authors = [
    { name = "nilay007hckkr", email = "nilay00700@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.0",
    "tqdm>=4.70.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = "."
