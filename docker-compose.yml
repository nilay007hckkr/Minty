services:
  redis:
    image: redis:7-alpine
    # No `ports:` on purpose. The app reaches Redis over the compose network
    # (REDIS_HOST=redis). Publishing 6379 on the host exposed an unauthenticated
    # Redis: anyone who could reach the machine could read chat history or
    # write qcache:* entries and make the bot serve arbitrary answers.
    volumes:
      - redis-data:/data
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    volumes:
      # Named volume, not a ./data bind mount: the app runs as a non-root
      # user, and on Linux Docker creates a missing bind-mount dir as root,
      # which the app couldn't write to. The index rebuilds itself on startup.
      - chroma-data:/app/data

volumes:
  redis-data:
  chroma-data:
